name: CI
on:
  pull_request:
  push:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      MICROCMS_SERVICE_DOMAIN: ${{ vars.MICROCMS_SERVICE_DOMAIN }}
      MICROCMS_API_KEY: ${{ secrets.MICROCMS_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run build
      - name: Write preview identity
        if: github.event_name == 'pull_request' && github.event.pull_request.number == 10
        run: |
          printf '%s\n' 'sousei.preview/v1' 'repository=sowsei-inc/sowsei-site' 'pr=10' "head_sha=${GITHUB_SHA}" > dist/PREVIEW_IDENTITY.txt
      - name: Upload exact preview artifact
        if: github.event_name == 'pull_request' && github.event.pull_request.number == 10
        uses: actions/upload-artifact@v4
        with:
          name: company-site-preview-pr10-${{ github.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 30
      - name: Install lftp for preview
        if: github.event_name == 'pull_request' && github.head_ref == 'preview/company-first-20260923'
        run: sudo apt-get update && sudo apt-get install -y lftp
      - name: Deploy isolated public preview
        if: github.event_name == 'pull_request' && github.head_ref == 'preview/company-first-20260923'
        env:
          FTP_HOST: ${{ secrets.XSERVER_FTP_HOST }}
          FTP_USER: ${{ secrets.XSERVER_FTP_USER }}
          FTP_PASSWORD: ${{ secrets.XSERVER_FTP_PASSWORD }}
        run: |
          lftp -e "
            set ftp:ssl-force true;
            set ssl:verify-certificate true;
            open $FTP_HOST;
            user $FTP_USER $FTP_PASSWORD;
            mkdir -p /preview/company-first-20260923;
            mirror --reverse --delete --verbose dist/ /preview/company-first-20260923/;
            bye
          "
