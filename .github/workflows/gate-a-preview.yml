name: Gate A Preview

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install
        run: npm install
      - name: Build
        run: npm run build
      - name: Package touchable preview
        run: |
          cd dist
          zip -r ../sowsei-site-gate-a.zip .
      - name: Upload preview
        uses: actions/upload-artifact@v4
        with:
          name: sowsei-site-gate-a
          path: sowsei-site-gate-a.zip
          retention-days: 7
