name: Deploy preview

on:
  push:
    branches:
      - preview/company-first-20260923

permissions:
  contents: read

concurrency:
  group: company-site-preview
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      MICROCMS_SERVICE_DOMAIN: ${{ vars.MICROCMS_SERVICE_DOMAIN }}
      MICROCMS_API_KEY: ${{ secrets.MICROCMS_API_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Build
        run: npm run build

      - name: Install lftp
        run: sudo apt-get update && sudo apt-get install -y lftp

      - name: Deploy preview to Xserver subdirectory
        env:
          FTP_HOST: ${{ secrets.XSERVER_FTP_HOST }}
          FTP_USER: ${{ secrets.XSERVER_FTP_USER }}
          FTP_PASSWORD: ${{ secrets.XSERVER_FTP_PASSWORD }}
        run: |
          lftp -e "
            set ftp:ssl-force true;
            set ssl:verify-certificate true;
            set net:timeout 10;
            set net:max-retries 2;
            open $FTP_HOST;
            user $FTP_USER $FTP_PASSWORD;
            mirror --reverse --delete --verbose --create-dirs dist/ /preview/company-first-20260923/;
            bye
          "
